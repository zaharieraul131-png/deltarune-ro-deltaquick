name: Wrap Lines & Publish Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Auto-Wrap Long Dialogue Lines
        run: |
          python -u - << 'EOF'
          import json, os, re

          TAG_RE = re.compile(r"(\\[A-Za-z][0-9A-Za-z]?|\\n|\^[0-9]|~[0-9]|&|/|\*|%|\{[^}]+\}|\[[^\]]+\])")

          def visible_len(s):
              return len(TAG_RE.sub("", s))

          def wrap_segment(seg, max_len):
              if visible_len(seg) <= max_len:
                  return seg
              words = seg.split(" ")
              lines, cur = [], ""
              for w in words:
                  cand = f"{cur} {w}".strip() if cur else w
                  if cur and visible_len(cand) > max_len:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = cand
              if cur:
                  lines.append(cur)
              return "&".join(lines)

          def wrap_dialogue(text):
              if not isinstance(text, str) or not text.strip():
                  return text
              # If a portrait tag (\E0, \F1, etc.) is present, boxes are narrower (~25 chars); otherwise ~33 chars
              has_face = bool(re.search(r"\\[EF][0-9A-Za-z]", text))
              limit = 25 if has_face else 33
              # Split on existing manual breaks (& or \n) and wrap any segment that overflows
              parts = re.split(r"(&|\\n)", text)
              out = []
              for p in parts:
                  if p in ("&", "\\n"):
                      out.append(p)
                  else:
                      out.append(wrap_segment(p, limit))
              return "".join(out)

          for fp in [f"chapter{i}/strings.json" for i in range(1, 6)]:
              if not os.path.exists(fp):
                  continue
              with open(fp, "r", encoding="utf-8") as f:
                  data = json.load(f)
              fixed = 0
              for k, v in data.items():
                  nv = wrap_dialogue(v)
                  if nv != v:
                      data[k] = nv
                      fixed += 1
              with open(fp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"{fp}: wrapped {fixed} overflowing lines")
          EOF

      - name: Pack Zip and Commit
        run: |
          rm -rf delta-romanian.zip lang
          mkdir -p lang
          cp -r chapter1 chapter2 chapter3 chapter4 chapter5 settings.json strings.json lang/
          zip -r delta-romanian.zip lang
          rm -rf lang
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Auto-wrap long dialogue lines for in-game text boxes" || echo "No changes"
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Deltarune Romanian Translation (Chapters 1–5) v1.0.0"
          body: |
            Full Romanian translation pack for **Deltarune (Chapters 1–5)** on Android (**DeltaQuick**).
            
            ### Quick Install:
            1. Install **Deltranslate Base Obligatory** (`mod_deltranslate_5.2.8_deltaquick.zip`) in DeltaQuick first.
            2. Download **`delta-romanian.zip`** below and install it in DeltaQuick (`Select folder` → `Select ZIP`).
            3. Switch the in-game language toggle on the Chapter Select screen and play!
          files: delta-romanian.zip
          
