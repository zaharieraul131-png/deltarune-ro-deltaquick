name: Scan, Wrap & Publish Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Polish Menu Line-Breaks & All Dialogue Bullets (v1.1.1)
        run: |
          python -u - << 'EOF'
          import json, os, re

          TAG_RE = re.compile(r"(\\[A-Za-z][0-9A-Za-z]?|\\n|\^[0-9]|~[0-9]|&|/|\*|%|\{[^}]+\}|\[[^\]]+\])")

          def visible_len(s):
              return len(TAG_RE.sub("", s))

          def wrap_words(text, max_len):
              text = re.sub(r" {2,}", " ", text).strip()
              if not text:
                  return []
              words = text.split(" ")
              lines, cur = [], ""
              for w in words:
                  if w in ("?", "!", ".", ",", ":", ";") and cur:
                      cur += w
                      continue
                  cand = f"{cur} {w}".strip() if cur else w
                  if cur and visible_len(cand) > max_len:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = cand
              if cur:
                  lines.append(cur)
              return lines

          def reflow_dialogue(key, text):
              if not isinstance(text, str) or not text.strip():
                  return text
              if re.search(r"\\C[0-9]", text):
                  return text
              if "DEVICE_" in key:
                  text = re.sub(r"&([?!.,:;])", r"\1", text)
                  parts = re.split(r"(&|\\n)", text)
                  out = []
                  for p in parts:
                      if p in ("&", "\\n"):
                          out.append(p)
                      else:
                          out.append("&".join(wrap_words(p, 19)) if p.strip() else p)
                  return "".join(out)

              limit = 24
              max_lines = 4 if "obj_readable" in key else 3
              pages = re.split(r"(/%|/|\\n)", text)
              rebuilt_pages = []
              for page in pages:
                  if page in ("/%", "/", "\\n") or not page.strip():
                      rebuilt_pages.append(page)
                      continue
                  trailing = ""
                  m_trail = re.search(r"(\s*%+\s*)$", page)
                  if m_trail:
                      trailing = m_trail.group(1)
                      page = page[:m_trail.start()]
                  flat = page.replace("&", " ")
                  flat = re.sub(r" {2,}", " ", flat).strip()
                  # Split on ANY mid-box bullet (*Word or *"Quote), even right after punctuation/tags!
                  sub_blocks = re.split(r"\s*(?<!^)(?=\*[A-Za-z0-9\"'(\[])", flat)
                  page_lines = []
                  for sb in sub_blocks:
                      page_lines.extend(wrap_words(sb, limit))
                  if len(page_lines) <= max_lines:
                      rebuilt_pages.append("&".join(page_lines) + trailing)
                  else:
                      chunks = [page_lines[i:i+max_lines] for i in range(0, len(page_lines), max_lines)]
                      prefix_m = re.match(r"^((?:\\[A-Za-z][0-9A-Za-z]?)+)", page.strip())
                      prefix = prefix_m.group(1) if prefix_m else ""
                      formatted_chunks = []
                      for idx, ch in enumerate(chunks):
                          joined_ch = "&".join(ch)
                          if idx > 0 and prefix and not joined_ch.startswith("\\"):
                              joined_ch = prefix + joined_ch
                          formatted_chunks.append(joined_ch)
                      rebuilt_pages.append("/".join(formatted_chunks) + trailing)
              return "".join(rebuilt_pages)

          if os.path.exists("strings.json"):
              with open("strings.json", "r", encoding="utf-8") as f:
                  menu_data = json.load(f)
              for k, v in menu_data.items():
                  if isinstance(v, str):
                      menu_data[k] = re.sub(r"\s*&\s*", " ", v).strip()
              with open("strings.json", "w", encoding="utf-8") as f:
                  json.dump(menu_data, f, ensure_ascii=False, indent=2)

          for fp in [f"chapter{i}/strings.json" for i in range(1, 6)]:
              if not os.path.exists(fp):
                  continue
              with open(fp, "r", encoding="utf-8") as f:
                  data = json.load(f)
              fixed = 0
              for k, v in data.items():
                  nv = reflow_dialogue(k, v)
                  if nv != v:
                      data[k] = nv
                      fixed += 1
              with open(fp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"{fp}: polished {fixed} entries")
          EOF

      - name: Pack Zip and Commit
        run: |
          rm -rf delta-romanian.zip lang
          mkdir -p lang
          cp -r chapter1 chapter2 chapter3 chapter4 chapter5 settings.json strings.json lang/
          zip -r delta-romanian.zip lang
          rm -rf lang
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Split all mid-box dialogue bullets & polish menu prompts (v1.1.1)" || echo "No changes"
          git push

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.1.1 --cleanup-tag -y || true
          gh release create v1.1.1 delta-romanian.zip \
            --title "Deltarune Romanian Translation (Chapters 1–5) v1.1.1" \
            --notes "Full Romanian translation pack for Deltarune (Chapters 1–5) on Android (DeltaQuick). Polished Chapter Select menu prompts and aligned all mid-box dialogue bullets (*)."
            
