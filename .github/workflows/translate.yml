name: Scan, Wrap & Publish Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smart Box Fit (23/27 Width, Max 3 Lines, No Orphan 1-Word Pages) (v1.2.6)
        run: |
          python -u - << 'EOF'
          import json, os, re

          TAG_RE = re.compile(r"(\\[A-Za-z][0-9A-Za-z]?|\\n|\^[0-9]|~[0-9]|&|/|\*|%|\{[^}]+\}|\[[^\]]+\])")

          def visible_len(s):
              return len(TAG_RE.sub("", s))

          def wrap_words(text, max_len):
              text = re.sub(r" {2,}", " ", text).strip()
              if not text:
                  return []
              words = text.split(" ")
              lines, cur = [], ""
              for w in words:
                  if w in ("?", "!", ".", ",", ":", ";") and cur:
                      cur += w
                      continue
                  cand = f"{cur} {w}".strip() if cur else w
                  if cur and visible_len(cand) > max_len:
                      lines.append(cur)
                      cur = w
                  else:
                      cur = cand
              if cur:
                  lines.append(cur)
              return lines

          def fix_choice_line(text):
              if "#" in text and not text.strip().startswith("*"):
                  parts = [p.strip() for p in text.split("#")]
                  padded = [("   " + p[:14].strip()) if p else p for p in parts]
                  return "#".join(padded)
              def pad_c(m):
                  tag = m.group(1)
                  label = m.group(2).strip()
                  return f"{tag}   {label}"
              return re.sub(r"(\\C[1-4])\s*([^\n\\&/#]+)", pad_c, text)

          def is_typewriter_dialogue(key, text):
              if re.search(r"\\C[0-9]", text) or ("#" in text and not text.strip().startswith("*")):
                  return False
              if "DEVICE_CONTACT" in key:
                  return True
              stripped = text.strip()
              if stripped.startswith("*") or re.match(r"^\\[A-Za-z][0-9A-Za-z]?\s*\*", stripped):
                  return True
              if stripped.endswith("/") or stripped.endswith("/%") or stripped.endswith("%"):
                  return True
              return False

          def reflow_dialogue(key, text):
              if not isinstance(text, str) or not text.strip():
                  return text

              # 1. Choice alignment: pad choices so SOUL heart sits cleanly to the left
              if re.search(r"\\C[0-9]", text) or ("#" in text and not text.strip().startswith("*")):
                  return fix_choice_line(text)

              # 2. HUD & menu cleanup: strip '&' from non-dialogue UI text
              if not is_typewriter_dialogue(key, text):
                  return re.sub(r"\s*&\s*", " ", text).strip()

              # 3. Gaster / DEVICE_CONTACT wide-font open screens
              if "DEVICE_CONTACT" in key:
                  text = re.sub(r"&([?!.,:;])", r"\1", text)
                  parts = re.split(r"(&|\\n)", text)
                  out = []
                  for p in parts:
                      if p in ("&", "\\n"):
                          out.append(p)
                      else:
                          out.append("&".join(wrap_words(p, 18)) if p.strip() else p)
                  return "".join(out)

              # Portrait boxes fit 23 chars/line; full-width narrator boxes fit 27 chars/line
              has_face = bool(re.search(r"\\[EF][0-9A-Za-z]", text))
              limit = 23 if has_face else 27
              max_lines = 3

              pages = re.split(r"(/%|/)", text)
              rebuilt_pages = []
              for page in pages:
                  if page in ("/%", "/") or not page.strip():
                      rebuilt_pages.append(page)
                      continue
                  trailing = ""
                  m_trail = re.search(r"(\s*%+\s*)$", page)
                  if m_trail:
                      trailing = m_trail.group(1)
                      page = page[:m_trail.start()]
                  flat = page.replace("&", " ").replace("\\n", " ")
                  flat = re.sub(r" {2,}", " ", flat).strip()

                  prefix_m = re.match(r"^((?:\\[A-Za-z][0-9A-Za-z]?)+)", flat)
                  prefix = prefix_m.group(1) if prefix_m else ""
                  body = flat[len(prefix):].strip() if prefix else flat

                  bullets = re.split(r"\s*(?<!^)(?=\*[A-Za-z0-9\"'(\[])", body)
                  all_box_pages = []
                  for b in bullets:
                      b_lines = wrap_words(b, limit)
                      if not b_lines:
                          continue
                      # If it slightly overflows 3 lines by just a few chars, try +2 chars width before splitting into a tiny orphan page!
                      if len(b_lines) == 4 and visible_len(b_lines[-1]) <= 12:
                          wider_lines = wrap_words(b, limit + 2)
                          if len(wider_lines) <= 3:
                              b_lines = wider_lines
                      chunks = [b_lines[i:i+max_lines] for i in range(0, len(b_lines), max_lines)]
                      for idx, ch in enumerate(chunks):
                          joined_ch = "&".join(ch)
                          # Ensure follow-up split pages keep speaker tag AND start cleanly
                          if idx > 0 and not joined_ch.startswith("*"):
                              joined_ch = "*" + joined_ch
                          if prefix and not joined_ch.startswith("\\"):
                              joined_ch = prefix + joined_ch
                          all_box_pages.append(joined_ch)

                  if all_box_pages:
                      rebuilt_pages.append("/".join(all_box_pages) + trailing)
                  else:
                      rebuilt_pages.append(page + trailing)
              return "".join(rebuilt_pages)

          if os.path.exists("strings.json"):
              with open("strings.json", "r", encoding="utf-8") as f:
                  menu_data = json.load(f)
              for k, v in menu_data.items():
                  if isinstance(v, str):
                      menu_data[k] = re.sub(r"\s*&\s*", " ", v).strip()
              with open("strings.json", "w", encoding="utf-8") as f:
                  json.dump(menu_data, f, ensure_ascii=False, indent=2)

          for fp in [f"chapter{i}/strings.json" for i in range(1, 6)]:
              if not os.path.exists(fp):
                  continue
              with open(fp, "r", encoding="utf-8") as f:
                  data = json.load(f)
              fixed = 0
              for k, v in data.items():
                  nv = reflow_dialogue(k, v)
                  if nv != v:
                      data[k] = nv
                      fixed += 1
              with open(fp, "w", encoding="utf-8") as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
              print(f"{fp}: updated {fixed} entries")
          EOF

      - name: Pack Zip and Commit
        run: |
          rm -rf delta-romanian.zip lang
          mkdir -p lang
          cp -r chapter1 chapter2 chapter3 chapter4 chapter5 settings.json strings.json lang/
          zip -r delta-romanian.zip lang
          rm -rf lang
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Smart 23/27 width, prevent 1-word orphan pages & keep portrait tags on split pages (v1.2.6)" || echo "No changes"
          git push

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete v1.2.6 --cleanup-tag -y || true
          gh release create v1.2.6 delta-romanian.zip \
            --title "Deltarune Romanian Translation (Chapters 1–5) v1.2.6" \
            --notes "Full Romanian translation pack for Deltarune (Chapters 1–5) on Android (DeltaQuick). Prevented 1-word orphan pages (like Toriel's 'orasel'), preserved portrait tags on split pages, fixed kitchen cookie-cutter 3-line fit, and aligned choice selectors."
            
